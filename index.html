
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Results Management</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
        <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Results Management</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
        </head>

<body>

    <div class="container">

        <h1>Student Results Management</h1>

        <div class="main-card">

            <h3 class="mb-4">Add Student</h3>

            <input
                type="text"
                id="studentName"
                class="form-control mb-3"
                placeholder="Student Name"
            >

            <input
                type="number"
                id="subject1"
                class="form-control mb-3"
                placeholder="Subject 1"
            >

            <input
                type="number"
                id="subject2"
                class="form-control mb-3"
                placeholder="Subject 2"
            >

            <input
                type="number"
                id="subject3"
                class="form-control mb-3"
                placeholder="Subject 3"
            >

            <input
                type="number"
                id="attendance"
                class="form-control mb-3"
                placeholder="Attendance Percentage"
            >

            <button
                id="addStudent"
                class="btn btn-primary w-100 mb-3"
            >
                Add Student
            </button>

            <button
                id="graceBtn"
                class="btn btn-success w-100"
            >
                Activate Grace Committee
            </button>

            <div id="errorBox" class="text-danger mt-3"></div>

            <div class="mt-4">
                <h3>Students List</h3>
                <div id="studentsBox"></div>
            </div>

            <div class="mt-4 mb-3">
                <h3>Grace Committee Report</h3>
                <div id="reportBox"></div>
            </div>

        </div>
    </div>

    <script src="main.js"></script>

</body>
</html>
